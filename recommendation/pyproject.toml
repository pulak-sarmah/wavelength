[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-engine"
version = "0.1.0"
description = "Vibe profile -> music query -> real songs, provider-agnostic."
requires-python = ">=3.10"
dependencies = [
    "vibe-ml",
]

[tool.setuptools.packages.find]
where = ["src"]
